name: Deploy Azure production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only or deploy the hosted Promise MCP server
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
      MCP_APP: ${{ vars.AZURE_MCP_APP_NAME }}
      PROMISE_PLATFORM_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PROMISE_APP_URL: ${{ vars.PROMISE_APP_URL }}
      PROMISE_SITE_URL: ${{ vars.PROMISE_SITE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Validate source before Azure mutation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run --silent smoke >/tmp/promise-mcp-smoke.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const smoke = JSON.parse(fs.readFileSync("/tmp/promise-mcp-smoke.json", "utf8"));
          const tools = smoke.tools?.result?.tools ?? [];
          if (tools.length !== 11) throw new Error(`Expected 11 MCP tools, found ${tools.length}`);
          if (smoke.authRequired?.result?.structuredContent?.type !== "promise_auth_required") {
            throw new Error("Protected tool did not return promise_auth_required without auth");
          }
          NODE

      - name: Azure login with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP ACR_NAME WEB_APP MCP_APP PROMISE_PLATFORM_API_URL PROMISE_APP_URL PROMISE_SITE_URL; do
            value="${!name:-}"
            if [[ -z "${value}" ]]; then
              echo "Missing ${name}" >&2
              exit 1
            fi
          done
          az containerapp show --resource-group "${RESOURCE_GROUP}" --name "${WEB_APP}" --only-show-errors >/dev/null

      - name: Sign in to ACR
        run: az acr login --name "${ACR_NAME}" --only-show-errors

      - name: Build and push candidate image
        shell: bash
        run: |
          set -euo pipefail
          registry="${ACR_NAME}.azurecr.io"
          image="${registry}/promise-mcp:${IMAGE_TAG}"
          docker build --platform linux/amd64 -t "${image}" .
          docker push "${image}"
          digest="$(az acr repository show --name "${ACR_NAME}" --image "promise-mcp:${IMAGE_TAG}" \
            --query digest --output tsv --only-show-errors)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "MCP_IMAGE=${registry}/promise-mcp@${digest}" >> "${GITHUB_ENV}"

      - name: Inspect candidate image
        if: ${{ inputs.operation == 'inspect' }}
        shell: bash
        run: |
          {
            echo "## Promise MCP inspect complete"
            echo "- Image: \`${MCP_IMAGE}\`"
            echo "- No production app mutation was requested."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create or update MCP Container App
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          web_json="$(az containerapp show --resource-group "${RESOURCE_GROUP}" --name "${WEB_APP}" --only-show-errors)"
          environment_id="$(node --input-type=module -e 'const app=JSON.parse(process.argv[1]); console.log(app.properties.environmentId)' "${web_json}")"
          identity_id="$(node --input-type=module -e 'const app=JSON.parse(process.argv[1]); console.log(Object.keys(app.identity.userAssignedIdentities)[0])' "${web_json}")"
          registry="${ACR_NAME}.azurecr.io"

          if az containerapp show --resource-group "${RESOURCE_GROUP}" --name "${MCP_APP}" --only-show-errors >/dev/null 2>&1; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${MCP_APP}" \
              --image "${MCP_IMAGE}" \
              --set-env-vars \
                NODE_ENV=production \
                PORT=3000 \
                PROMISE_PLATFORM_API_URL="${PROMISE_PLATFORM_API_URL}" \
                PROMISE_APP_URL="${PROMISE_APP_URL}" \
                PROMISE_SITE_URL="${PROMISE_SITE_URL}" \
              --only-show-errors
          else
            az containerapp create \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${MCP_APP}" \
              --environment "${environment_id}" \
              --user-assigned "${identity_id}" \
              --registry-server "${registry}" \
              --registry-identity "${identity_id}" \
              --image "${MCP_IMAGE}" \
              --ingress external \
              --target-port 3000 \
              --transport auto \
              --min-replicas 1 \
              --max-replicas 2 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --env-vars \
                NODE_ENV=production \
                PORT=3000 \
                PROMISE_PLATFORM_API_URL="${PROMISE_PLATFORM_API_URL}" \
                PROMISE_APP_URL="${PROMISE_APP_URL}" \
                PROMISE_SITE_URL="${PROMISE_SITE_URL}" \
              --only-show-errors
          fi

      - name: Smoke test production MCP
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --resource-group "${RESOURCE_GROUP}" --name "${MCP_APP}" \
            --query properties.configuration.ingress.fqdn --output tsv --only-show-errors)"
          test -n "${fqdn}"
          url="https://${fqdn}"
          for attempt in {1..30}; do
            if curl -fsS "${url}/healthz" >/tmp/promise-mcp-health.json; then
              break
            fi
            sleep 5
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("/tmp/promise-mcp-health.json", "utf8"));
          if (health.status !== "ok") throw new Error("MCP health check did not return ok");
          NODE
          tools="$(curl -fsS "${url}/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          node --input-type=module -e 'const body=JSON.parse(process.argv[1]); if (body.result.tools.length !== 11) throw new Error("Expected 11 tools");' "${tools}"
          {
            echo "## Promise MCP deployed"
            echo "- Revision: \`${IMAGE_TAG}\`"
            echo "- Endpoint: ${url}"
            echo "- Image: \`${MCP_IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
